<!DOCTYPE html>
<html lang="pt-BR">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
   <title>Pixel-Yoshi Runner</title>
   <style>
       * {
           box-sizing: border-box;
           user-select: none;
           -webkit-user-select: none;
           touch-action: manipulation;
       }

       body, html {
           margin: 0;
           padding: 0;
           width: 100%;
           height: 100%;
           overflow: hidden;
           background-color: #1a1a1a;
           font-family: 'Courier New', Courier, monospace;
       }

       #game-container {
           position: relative;
           width: 100vw;
           height: 100vh;
           display: flex;
           justify-content: center;
           align-items: center;
           background-color: #87CEEB;
       }

       canvas {
           display: block;
           width: 100%;
           height: 100%;
           image-rendering: -moz-crisp-edges;
           image-rendering: -webkit-crisp-edges;
           image-rendering: pixelated;
           image-rendering: crisp-edges;
       }

       .ui-screen {
           position: absolute;
           top: 0;
           left: 0;
           width: 100%;
           height: 100%;
           background: rgba(0, 0, 0, 0.65);
           display: flex;
           flex-direction: column;
           justify-content: center;
           align-items: center;
           color: #FFFFFF;
           z-index: 10;
       }

       .ui-card {
           background: #2C3E50;
           border: 4px solid #ECF0F1;
           padding: 24px;
           border-radius: 8px;
           text-align: center;
           max-width: 90%;
           width: 320px;
           box-shadow: 0 8px 16px rgba(0,0,0,0.5);
       }

       .ui-card h1 {
           margin: 0 0 12px 0;
           font-size: 22px;
           color: #2ECC71;
           text-transform: uppercase;
           letter-spacing: 1px;
       }

       .ui-card p {
           margin: 8px 0;
           font-size: 14px;
           color: #BDC3C7;
       }

       .btn {
           margin-top: 16px;
           padding: 12px 24px;
           background: #E67E22;
           color: #FFF;
           border: none;
           border-radius: 4px;
           font-size: 16px;
           font-weight: bold;
           font-family: inherit;
           cursor: pointer;
           box-shadow: 0 4px #D35400;
       }

       .btn:active {
           transform: translateY(2px);
           box-shadow: 0 2px #D35400;
       }

       #touch-controls {
           position: absolute;
           top: 0;
           left: 0;
           width: 100%;
           height: 100%;
           z-index: 5;
           display: flex;
           pointer-events: none;
       }

       .touch-zone {
           flex: 1;
           height: 100%;
           pointer-events: auto;
           display: flex;
           justify-content: center;
           align-items: flex-end;
           padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
       }

       .control-btn {
           width: 68px;
           height: 68px;
           background: rgba(255, 255, 255, 0.25);
           border: 3px solid rgba(255, 255, 255, 0.7);
           border-radius: 50%;
           display: flex;
           flex-direction: column;
           justify-content: center;
           align-items: center;
           color: #FFFFFF;
           font-size: 11px;
           font-weight: bold;
           backdrop-filter: blur(2px);
       }

       .control-btn:active {
           background: rgba(255, 255, 255, 0.5);
       }

       .hidden {
           display: none !important;
       }
   </style>
</head>
<body>
   <div id="game-container">
       <canvas id="gameCanvas"></canvas>

       <div id="touch-controls">
           <div class="touch-zone" id="zone-duck">
               <div class="control-btn">
                   <span style="font-size: 18px;">▼</span>
                   <span>DUCK</span>
               </div>
           </div>
           <div class="touch-zone" id="zone-jump">
               <div class="control-btn">
                   <span style="font-size: 18px;">▲</span>
                   <span>JUMP</span>
               </div>
           </div>
       </div>

       <div id="start-screen" class="ui-screen">
           <div class="ui-card">
               <h1>PIXEL-YOSHI</h1>
               <p><strong>Controles:</strong></p>
               <p>▲ Pular (Espaço / Seta Cima)</p>
               <p>▼ Agachar (Seta Baixo / S)</p>
               <button class="btn" id="start-btn">JOGAR</button>
           </div>
       </div>

       <div id="game-over-screen" class="ui-screen hidden">
           <div class="ui-card">
               <h1 style="color: #E74C3C;">GAME OVER</h1>
               <p>Pontuação: <span id="final-score">0</span></p>
               <p>Melhor: <span id="final-best">0</span></p>
               <button class="btn" id="restart-btn">JOGAR NOVAMENTE</button>
           </div>
       </div>
   </div>

   <audio id="audio-start" src="game-start.mp3" preload="auto"></audio>
   <audio id="audio-lose" src="lose-life.mp3" preload="auto"></audio>
   <audio id="audio-powerup" src="powerup.mp3" preload="auto"></audio>

   <script>
       const canvas = document.getElementById('gameCanvas');
       const ctx = canvas.getContext('2d');

       const INTERNAL_HEIGHT = 256;
       let internalWidth = 0;
       let scale = 1;

       function resize() {
           canvas.width = window.innerWidth;
           canvas.height = window.innerHeight;
           scale = canvas.height / INTERNAL_HEIGHT;
           internalWidth = canvas.width / scale;
           ctx.imageSmoothingEnabled = false;
       }
       window.addEventListener('resize', resize);
       resize();

       const BASE_SPEED = 90;
       let currentSpeed = BASE_SPEED;
       let gameState = 'START';
       let score = 0;
       let highScore = parseInt(localStorage.getItem('pixel_yoshi_high') || '0');
       let lives = 3;
       let invulnerableTimer = 0;
       let lastTime = 0;

       let audioCtx = null;
       function initAudioContext() {
           if (!audioCtx) {
               audioCtx = new (window.AudioContext || window.webkitAudioContext)();
           }
           if (audioCtx.state === 'suspended') {
               audioCtx.resume();
           }
       }

       function playStartSound() {
           const audio = document.getElementById('audio-start');
           audio.currentTime = 0;
           audio.play().catch(() => {
               initAudioContext();
               if (!audioCtx) return;
               const osc = audioCtx.createOscillator();
               const gain = audioCtx.createGain();
               osc.type = 'triangle';
               osc.frequency.setValueAtTime(220, audioCtx.currentTime);
               osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.3);
               gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
               gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
               osc.connect(gain);
               gain.connect(audioCtx.destination);
               osc.start();
               osc.stop(audioCtx.currentTime + 0.3);
           });
       }

       function playGameOverSound() {
           const audio = document.getElementById('audio-lose');
           audio.currentTime = 0;
           audio.play().catch(() => {
               initAudioContext();
               if (!audioCtx) return;
               const osc = audioCtx.createOscillator();
               const gain = audioCtx.createGain();
               osc.type = 'sawtooth';
               osc.frequency.setValueAtTime(300, audioCtx.currentTime);
               osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.6);
               gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
               gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
               osc.connect(gain);
               gain.connect(audioCtx.destination);
               osc.start();
               osc.stop(audioCtx.currentTime + 0.6);
           });
       }

       function playHitSound() {
           initAudioContext();
           if (!audioCtx) return;
           const osc = audioCtx.createOscillator();
           const gain = audioCtx.createGain();
           osc.type = 'square';
           osc.frequency.setValueAtTime(150, audioCtx.currentTime);
           osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.15);
           gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
           gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
           osc.connect(gain);
           gain.connect(audioCtx.destination);
           osc.start();
           osc.stop(audioCtx.currentTime + 0.15);
       }

       function playActionSound() {
           const audio = document.getElementById('audio-powerup');
           audio.currentTime = 0;
           audio.play().catch(() => {
               initAudioContext();
               if (!audioCtx) return;
               const osc = audioCtx.createOscillator();
               const gain = audioCtx.createGain();
               osc.type = 'sine';
               osc.frequency.setValueAtTime(350, audioCtx.currentTime);
               osc.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.12);
               gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
               gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
               osc.connect(gain);
               gain.connect(audioCtx.destination);
               osc.start();
               osc.stop(audioCtx.currentTime + 0.12);
           });
       }

       class Yoshi {
           constructor() {
               this.x = 40;
               this.yBase = INTERNAL_HEIGHT - 48;
               this.y = this.yBase - 28;
               this.width = 20;
               this.height = 28;
               this.vy = 0;
               this.gravity = 500;
               this.jumpForce = -230;
               this.isGrounded = true;
               this.isCrouching = false;
               this.animFrame = 0;
               this.animTimer = 0;
           }

           jump() {
               if (this.isGrounded && !this.isCrouching) {
                   this.vy = this.jumpForce;
                   this.isGrounded = false;
                   playActionSound();
               }
           }

           crouch(state) {
               if (this.isGrounded) {
                   if (state && !this.isCrouching) {
                       playActionSound();
                   }
                   this.isCrouching = state;
                   if (this.isCrouching) {
                       this.height = 16;
                       this.y = this.yBase - 16;
                   } else {
                       this.height = 28;
                       this.y = this.yBase - 28;
                   }
               }
           }

           update(dt) {
               if (!this.isGrounded) {
                   this.vy += this.gravity * dt;
                   this.y += this.vy * dt;

                   if (this.y >= this.yBase - this.height) {
                       this.y = this.yBase - this.height;
                       this.vy = 0;
                       this.isGrounded = true;
                   }
               }

               this.animTimer += dt;
               if (this.animTimer > 0.12) {
                   this.animFrame = (this.animFrame + 1) % 2;
                   this.animTimer = 0;
               }
           }

           getBounds() {
               return {
                   x: this.x + 3,
                   y: this.y + 2,
                   width: this.width - 6,
                   height: this.height - 4
               };
           }

           draw(ctx) {
               if (invulnerableTimer > 0 && Math.floor(invulnerableTimer * 12) % 2 === 0) {
                   return;
               }

               const px = this.x;
               const py = this.y;

               if (this.isCrouching) {
                   ctx.fillStyle = '#00AA00';
                   ctx.fillRect(px, py + 4, 18, 12);
                   ctx.fillStyle = '#FFFFFF';
                   ctx.fillRect(px + 10, py + 8, 8, 8);
                   ctx.fillStyle = '#000000';
                   ctx.fillRect(px + 14, py + 5, 2, 3);
                   ctx.fillStyle = '#FF5500';
                   ctx.fillRect(px + 2, py + 12, 14, 4);
               } else {
                   ctx.fillStyle = '#00AA00';
                   ctx.fillRect(px + 4, py, 12, 14);
                   ctx.fillRect(px, py + 10, 16, 12);
                   
                   ctx.fillStyle = '#FFFFFF';
                   ctx.fillRect(px + 10, py + 4, 8, 8);
                   ctx.fillRect(px + 6, py + 12, 10, 8);
                   
                   ctx.fillStyle = '#000000';
                   ctx.fillRect(px + 10, py + 2, 2, 4);
                   
                   ctx.fillStyle = '#FF0000'; ctx.fillRect(px + 2, py + 6, 3, 3);
                   ctx.fillStyle = '#FFFF00'; ctx.fillRect(px + 2, py + 10, 3, 3);
                   ctx.fillStyle = '#0000FF'; ctx.fillRect(px + 2, py + 14, 3, 3);

                   ctx.fillStyle = '#FF5500';
                   if (this.isGrounded) {
                       if (this.animFrame === 0) {
                           ctx.fillRect(px, py + 22, 8, 6);
                           ctx.fillRect(px + 10, py + 20, 8, 6);
                       } else {
                           ctx.fillRect(px + 2, py + 20, 8, 6);
                           ctx.fillRect(px + 8, py + 22, 8, 6);
                       }
                   } else {
                       ctx.fillRect(px + 1, py + 20, 8, 6);
                       ctx.fillRect(px + 9, py + 20, 8, 6);
                   }
               }
           }
       }

       class Cloud {
           constructor(initial = false) { this.reset(initial); }
           reset(initial = false) {
               this.x = initial ? Math.random() * internalWidth : internalWidth + 20;
               this.y = 15 + Math.random() * 60;
               this.speedMult = 0.15 + Math.random() * 0.1;
               this.scale = 1 + Math.random();
           }
           update(dt) {
               this.x -= currentSpeed * this.speedMult * dt;
               if (this.x < -60) this.reset();
           }
           draw(ctx) {
               ctx.fillStyle = '#FFFFFF';
               ctx.fillRect(this.x, this.y + 5, 30 * this.scale, 8 * this.scale);
               ctx.fillRect(this.x + 5 * this.scale, this.y, 20 * this.scale, 12 * this.scale);
           }
       }

       class Mountain {
           constructor(x) {
               this.x = x;
               this.width = 160;
               this.height = 90;
               this.speedMult = 0.25;
           }
           update(dt) {
               this.x -= currentSpeed * this.speedMult * dt;
               if (this.x + this.width < -20) {
                   this.x = internalWidth + Math.random() * 40;
               }
           }
           draw(ctx) {
               const baseY = INTERNAL_HEIGHT - 48;
               ctx.fillStyle = '#7F8C8D';
               ctx.beginPath();
               ctx.moveTo(this.x, baseY);
               ctx.lineTo(this.x + this.width / 2, baseY - this.height);
               ctx.lineTo(this.x + this.width, baseY);
               ctx.fill();

               ctx.fillStyle = '#FFFFFF';
               ctx.beginPath();
               ctx.moveTo(this.x + this.width / 2, baseY - this.height);
               ctx.lineTo(this.x + this.width / 2 + 20, baseY - this.height + 30);
               ctx.lineTo(this.x + this.width / 2 - 20, baseY - this.height + 30);
               ctx.fill();
           }
       }

       class Obstacle {
           constructor(x, type) {
               this.x = x;
               this.type = type;
               this.width = 18;
               this.height = 18;
               this.destroyed = false;
               
               const yBase = INTERNAL_HEIGHT - 48;
               this.y = (type === 'GROUND') ? yBase - this.height : yBase - 40;
           }

           update(dt) {
               this.x -= currentSpeed * dt;
           }

           getBounds() {
               return { x: this.x, y: this.y, width: this.width, height: this.height };
           }

           draw(ctx) {
               if (this.destroyed) return;

               if (this.type === 'GROUND') {
                   ctx.fillStyle = '#E67E22';
                   ctx.fillRect(this.x, this.y, this.width, this.height);
                   ctx.fillStyle = '#D35400';
                   ctx.fillRect(this.x + 2, this.y + 2, this.width - 4, this.height - 4);
               } else {
                   ctx.fillStyle = '#8E44AD';
                   ctx.fillRect(this.x, this.y, this.width, this.height);
                   ctx.fillStyle = '#F1C40F';
                   ctx.fillRect(this.x + 7, this.y + 4, 4, 10);
               }
           }
       }

       let particles = [];
       function createExplosion(x, y) {
           for (let i = 0; i < 12; i++) {
               particles.push({
                   x: x, y: y,
                   vx: (Math.random() - 0.5) * 160,
                   vy: (Math.random() - 0.5) * 160,
                   life: 0.3,
                   color: Math.random() > 0.5 ? '#E67E22' : '#8E44AD'
               });
           }
       }

       function updateParticles(dt) {
           for (let i = particles.length - 1; i >= 0; i--) {
               let p = particles[i];
               p.x += p.vx * dt;
               p.y += p.vy * dt;
               p.life -= dt;
               if (p.life <= 0) particles.splice(i, 1);
           }
       }

       function drawParticles(ctx) {
           particles.forEach(p => {
               ctx.fillStyle = p.color;
               ctx.fillRect(p.x, p.y, 3, 3);
           });
       }

       const player = new Yoshi();
       const clouds = [new Cloud(true), new Cloud(true), new Cloud(true)];
       const mountains = [new Mountain(20), new Mountain(220)];
       let obstacles = [];
       let groundOffset = 0;

       function spawnObstacles() {
           if (obstacles.length < 3) {
               let lastX = internalWidth;
               obstacles.forEach(o => { if (o.x > lastX) lastX = o.x; });
               
               const nextX = lastX + 130 + Math.random() * 120;
               const type = Math.random() > 0.5 ? 'GROUND' : 'FLOATING';
               obstacles.push(new Obstacle(nextX, type));
           }
       }

       function checkAABBCollision(rect1, rect2) {
           return (
               rect1.x < rect2.x + rect2.width &&
               rect1.x + rect1.width > rect2.x &&
               rect1.y < rect2.y + rect2.height &&
               rect1.y + rect1.height > rect2.y
           );
       }

       function drawGround(ctx) {
           const groundHeight = 48;
           const yBase = INTERNAL_HEIGHT - groundHeight;
           const tileSize = 24;
           const startX = groundOffset % tileSize;

           for (let x = startX - tileSize; x < internalWidth + tileSize; x += tileSize) {
               ctx.fillStyle = '#795548';
               ctx.fillRect(x, yBase, tileSize, groundHeight);
               ctx.fillStyle = '#4CAF50';
               ctx.fillRect(x, yBase, tileSize, 10);
               ctx.fillStyle = '#81C784';
               ctx.fillRect(x, yBase, tileSize, 3);
           }
       }

       function drawHeart(ctx, x, y) {
           ctx.fillStyle = '#E74C3C';
           ctx.fillRect(x + 1, y, 2, 1); ctx.fillRect(x + 4, y, 2, 1);
           ctx.fillRect(x, y + 1, 7, 3);
           ctx.fillRect(x + 1, y + 4, 5, 1);
           ctx.fillRect(x + 2, y + 5, 3, 1);
           ctx.fillRect(x + 3, y + 6, 1, 1);
       }

       function drawUI(ctx) {
           ctx.font = 'bold 7px "Courier New", Courier, monospace';

           const scoreStr = Math.floor(score).toString().padStart(6, '0');
           const bestStr = Math.floor(highScore).toString().padStart(6, '0');

           ctx.fillStyle = '#000000';
           ctx.fillText(`SCORE ${scoreStr}`, 7, 13);
           ctx.fillText(`BEST  ${bestStr}`, 7, 23);

           ctx.fillStyle = '#FFFFFF';
           ctx.fillText(`SCORE ${scoreStr}`, 6, 12);
           ctx.fillText(`BEST  ${bestStr}`, 6, 22);

           const heartStartX = internalWidth - 14;
           for (let i = 0; i < lives; i++) {
               drawHeart(ctx, heartStartX - (i * 10), 8);
           }
       }

       function startGame() {
           initAudioContext();
           playStartSound();

           gameState = 'PLAYING';
           score = 0;
           lives = 3;
           currentSpeed = BASE_SPEED;
           invulnerableTimer = 0;
           obstacles = [];
           spawnObstacles();

           document.getElementById('start-screen').classList.add('hidden');
           document.getElementById('game-over-screen').classList.add('hidden');
       }

       function triggerGameOver() {
           playGameOverSound();

           gameState = 'GAMEOVER';
           if (score > highScore) {
               highScore = score;
               localStorage.setItem('pixel_yoshi_high', Math.floor(highScore).toString());
           }

           document.getElementById('final-score').innerText = Math.floor(score).toString().padStart(6, '0');
           document.getElementById('final-best').innerText = Math.floor(highScore).toString().padStart(6, '0');
           document.getElementById('game-over-screen').classList.remove('hidden');
       }

       function gameLoop(timestamp) {
           if (!lastTime) lastTime = timestamp;
           const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
           lastTime = timestamp;

           ctx.save();
           ctx.scale(scale, scale);

           ctx.fillStyle = '#87CEEB';
           ctx.fillRect(0, 0, internalWidth, INTERNAL_HEIGHT);

           clouds.forEach(c => { c.update(dt); c.draw(ctx); });
           mountains.forEach(m => { m.update(dt); m.draw(ctx); });

           if (gameState === 'PLAYING') {
               score += dt * 15;
               currentSpeed += dt * 1.5;
               invulnerableTimer = Math.max(0, invulnerableTimer - dt);

               player.update(dt);
               groundOffset -= currentSpeed * dt;

               spawnObstacles();
               for (let i = obstacles.length - 1; i >= 0; i--) {
                   let obs = obstacles[i];
                   obs.update(dt);

                   if (!obs.destroyed && invulnerableTimer <= 0) {
                       if (checkAABBCollision(player.getBounds(), obs.getBounds())) {
                           obs.destroyed = true;
                           createExplosion(obs.x + 9, obs.y + 9);
                           lives--;
                           invulnerableTimer = 1.2;

                           if (lives <= 0) {
                               triggerGameOver();
                           } else {
                               playHitSound();
                           }
                       }
                   }

                   if (obs.x < -30) obstacles.splice(i, 1);
               }

               updateParticles(dt);
           }

           obstacles.forEach(o => o.draw(ctx));
           drawGround(ctx);
           player.draw(ctx);
           drawParticles(ctx);

           drawUI(ctx);

           ctx.restore();
           requestAnimationFrame(gameLoop);
       }

       window.addEventListener('keydown', (e) => {
           if (e.code === 'Space' || e.code === 'ArrowUp') {
               if (gameState === 'PLAYING') player.jump();
               else if (gameState === 'START' || gameState === 'GAMEOVER') startGame();
           }
           if (e.code === 'ArrowDown' || e.code === 'KeyS') {
               if (gameState === 'PLAYING') player.crouch(true);
           }
       });

       window.addEventListener('keyup', (e) => {
           if (e.code === 'ArrowDown' || e.code === 'KeyS') {
               player.crouch(false);
           }
       });

       const zoneJump = document.getElementById('zone-jump');
       const zoneDuck = document.getElementById('zone-duck');

       zoneJump.addEventListener('touchstart', (e) => {
           e.preventDefault();
           if (gameState === 'PLAYING') player.jump();
       });

       zoneDuck.addEventListener('touchstart', (e) => {
           e.preventDefault();
           if (gameState === 'PLAYING') player.crouch(true);
       });

       zoneDuck.addEventListener('touchend', (e) => {
           e.preventDefault();
           player.crouch(false);
       });

       document.getElementById('start-btn').addEventListener('click', startGame);
       document.getElementById('restart-btn').addEventListener('click', startGame);

       requestAnimationFrame(gameLoop);
   </script>
</body>
</html>
